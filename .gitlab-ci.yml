stages: [test, build, package]

default:
  image: golang:1.24

test:
  stage: test
  script:
    - go test -race ./...
    - go vet ./...
    - go mod verify
    - go mod tidy -diff

build:
  stage: build
  script:
    - VERSION="${CI_COMMIT_TAG:-0.0.0-${CI_COMMIT_SHORT_SHA}}" COMMIT="$CI_COMMIT_SHA" BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" sh scripts/build-release-assets.sh
  artifacts:
    paths:
      - bin/

package:
  image: node:22
  stage: package
  needs:
    - job: build
      artifacts: true
  script:
    - PACKAGE_VERSION="$(node scripts/package-version.js "${CI_COMMIT_TAG:-0.0.0-${CI_COMMIT_SHORT_SHA}}")"; npm version --no-git-tag-version --allow-same-version "$PACKAGE_VERSION"; export PACKAGE_VERSION
    - npm test
    - sh tests/release/verify-assets.sh
    - EXPECTED_PACKAGE_VERSION="$PACKAGE_VERSION" sh tests/release/package-dry-run.sh
    - EXPECTED_VERSION="${CI_COMMIT_TAG:-0.0.0-${CI_COMMIT_SHORT_SHA}}" sh tests/release/local-install.sh
    - npm pack --ignore-scripts
  artifacts:
    paths:
      - everyline-cli-*.tgz
