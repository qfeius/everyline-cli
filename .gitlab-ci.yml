stages: [test, build, package]

default:
  image: golang:1.24

variables:
  # 当前 Runner 访问 proxy.golang.org 会超时；项目/组级 GOPROXY 变量可覆盖此默认值。
  GOPROXY: "https://goproxy.cn,direct"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/go-mod/
    - .cache/go-build/

test:
  stage: test
  script:
    - go test -race ./...
    - go vet ./...
    - go mod verify
    - go mod tidy -diff

build:
  stage: build
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        RELEASE_VERSION="${CI_COMMIT_TAG#v}"
      else
        RELEASE_VERSION="0.0.0-build-${CI_COMMIT_SHORT_SHA}"
      fi
      VERSION="$RELEASE_VERSION" COMMIT="$CI_COMMIT_SHA" BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" sh scripts/build-release-assets.sh
      printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" > bin/version.env
  artifacts:
    paths:
      - bin/
    reports:
      dotenv: bin/version.env

package:
  image: node:22
  stage: package
  needs:
    - job: build
      artifacts: true
  script:
    - test "$(node scripts/package-version.js "$RELEASE_VERSION")" = "$RELEASE_VERSION"
    - npm version --no-git-tag-version --allow-same-version "$RELEASE_VERSION"
    - npm test
    - sh tests/release/verify-assets.sh
    - EXPECTED_PACKAGE_VERSION="$RELEASE_VERSION" sh tests/release/package-dry-run.sh
    - EXPECTED_VERSION="$RELEASE_VERSION" sh tests/release/local-install.sh
    - npm pack
  artifacts:
    paths:
      - qfeius-everyline-cli-*.tgz
