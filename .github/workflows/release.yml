name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一标签串行处理，避免两个发布任务争抢同一个 npm 版本。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_REGISTRY_URL: https://registry.npmjs.org/

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Validate release version and channel
        id: package
        # 标签必须与已提交的包版本一致，防止源码、二进制和 Skill 版本分离。
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const pkg = require('./package.json');
          const { validateRelease } = require('./scripts/package-version');
          const version = process.env.GITHUB_REF_NAME.slice(1);
          validateRelease(version, pkg.publishConfig?.tag, 'latest');
          if (pkg.version !== version) throw new Error('发布标签必须为 v<package.json.version>');
          if (pkg.name !== '@qfeius/everyline-cli') throw new Error('npm 包名不匹配');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nchannel=${pkg.publishConfig.tag}\n`);
          NODE

      - name: Check npm publishing credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo '请在仓库 Actions Secrets 中配置 NPM_TOKEN'; exit 1; }
          npm whoami --registry "$NPM_REGISTRY_URL"

      - name: Test, build and verify installation
        run: make release-check

      - name: Publish native GitHub release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package CLI and Skills
        run: |
          # GoReleaser 清理 dist 后，重新生成独立 Skill 导入包。
          make skill-assets
          node scripts/pack-release.js .

      - name: Attach npm and Skill packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: gh release upload "$GITHUB_REF_NAME" "everyline-cli-${RELEASE_VERSION}.tgz" dist/*-skill.zip --clobber

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          NPM_TAG: ${{ steps.package.outputs.channel }}
        run: npm publish "everyline-cli-${RELEASE_VERSION}.tgz" --registry "$NPM_REGISTRY_URL" --access public --tag "$NPM_TAG"

      - name: Verify npm channel
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          NPM_TAG: ${{ steps.package.outputs.channel }}
        run: |
          # 查询独立 dist-tags 接口，避免整包元数据缓存；重试间隔累计最多 300 秒。
          for attempt in {1..21}; do
            if published_tags=$(npm dist-tag ls "@qfeius/everyline-cli" --registry "$NPM_REGISTRY_URL" --prefer-online); then
              published_version=$(printf '%s\n' "$published_tags" | awk -v tag="$NPM_TAG" '$1 == tag ":" { print $2 }')
              echo "npm channel $NPM_TAG attempt $attempt/21: ${published_version:-<empty>}"
              if [ "$published_version" = "$RELEASE_VERSION" ]; then
                exit 0
              fi
            else
              echo "npm channel $NPM_TAG attempt $attempt/21: lookup failed" >&2
            fi
            if [ "$attempt" -lt 21 ]; then
              sleep 15
            fi
          done
          echo "::error::npm channel $NPM_TAG did not reach $RELEASE_VERSION" >&2
          exit 1
